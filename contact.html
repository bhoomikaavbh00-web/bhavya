<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Bhavyashree S K</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 4rem;
            margin-top: 2rem;
        }
        .contact-info-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .info-item i {
            font-size: 1.5rem;
            color: var(--primary);
            background: rgba(20, 145, 155, 0.1);
            padding: 1rem;
            border-radius: 12px;
        }
        .info-item h4 {
            margin-bottom: 0.2rem;
        }
        .info-item p {
            color: var(--text-muted);
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(20, 145, 155, 0.2);
        }
        @media (max-width: 992px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">BHAVYASHREE<span>.</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="certifications.html">Certifications</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="mailto:bhavyabhavya8105@gmail.com" class="btn btn-primary">Hire Me</a>
    </nav>

    <section class="contact">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-container">
            <div class="contact-info-card">
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h4>Email</h4>
                        <p>bhavyabhavya8105@gmail.com</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <div>
                        <h4>Phone</h4>
                        <p>+91 8105246106</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h4>Location</h4>
                        <p>Tumkur, Karnataka, India</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fab fa-linkedin"></i>
                    <div>
                        <h4>LinkedIn</h4>
                        <p>bhavyabhavya</p>
                    </div>
                </div>
            </div>

            <form class="contact-form" action="mailto:bhavyabhavya8105@gmail.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="5" placeholder="Your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://linkedin.com/in/bhavyabhavya" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:bhavyabhavya8105@gmail.com"><i class="fas fa-envelope"></i></a>
            <a href="tel:8105246106"><i class="fas fa-phone"></i></a>
        </div>
        <p>&copy; 2026 Bhavyashree S K. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
